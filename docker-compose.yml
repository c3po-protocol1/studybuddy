version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: studybuddy-postgres
    environment:
      POSTGRES_USER: studybuddy
      POSTGRES_PASSWORD: studybuddy
      POSTGRES_DB: studybuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studybuddy -d studybuddy"]
      interval: 5s
      timeout: 5s
      retries: 5

  rag-service:
    build:
      context: ./rag-service
      dockerfile: Dockerfile
    container_name: studybuddy-rag-service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-text-embedding-3-small}
      RAG_WORKING_DIR: /app/lightrag_data
    ports:
      - "8000:8000"
    volumes:
      - rag_data:/app/lightrag_data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: studybuddy-backend
    depends_on:
      postgres:
        condition: service_healthy
      rag-service:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://studybuddy:studybuddy@postgres:5432/studybuddy?sslmode=disable
      AUTH_SECRET: ${AUTH_SECRET:-change-me-in-production}
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      RAG_SERVICE_URL: http://rag-service:8000
      PORT: "8080"
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-sonnet-4-20250514}
    ports:
      - "8080:8080"

volumes:
  postgres_data:
  rag_data:
